on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string

jobs:
  check-consistency:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5
      - name: Check version/date consistency
        run: |
          PDF_VER=$(grep -oP 'Ver\.\d+\.\d+\.\d+' config-pdf.yaml)
          EPUB_VER=$(grep -oP 'Ver\.\d+\.\d+\.\d+' config-epub.yaml)
          PDF_DATE_JP=$(grep bookVersion config-pdf.yaml | grep -oP '\d+年\d+月\d+日')
          PDF_DATE=$(echo "$PDF_DATE_JP" | sed 's/年/-/g;s/月/-/g;s/日//' | awk -F'-' '{printf "%04d-%02d-%02d", $1, $2, $3}')
          EPUB_DATE=$(grep -oP '(?<=date: )\d{4}-\d{2}-\d{2}' config-epub.yaml)
          ERROR=0
          if [ "$PDF_VER" != "$EPUB_VER" ]; then
            echo "::error::Version mismatch! config-pdf.yaml=$PDF_VER, config-epub.yaml=$EPUB_VER"
            ERROR=1
          fi
          if [ "$PDF_DATE" != "$EPUB_DATE" ]; then
            echo "::error::Date mismatch! config-pdf.yaml=$PDF_DATE, config-epub.yaml=$EPUB_DATE"
            ERROR=1
          fi
          if [ $ERROR -eq 0 ]; then echo "Version/Date OK: $PDF_VER / $EPUB_DATE"; fi
          exit $ERROR

  build-pdf:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    container:
      image: ghcr.io/lpi-japan/admin-text:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - uses: actions/checkout@v5
      - name: Build PDF
        run: |
          chmod +x ./build-pdf.sh
          ./build-pdf.sh
      - name: Upload PDF artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: |
            ${{ inputs.working-directory }}/tmp/admintext_*.pdf
          archive: false
          if-no-files-found: error

  build-epub:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    container:
      # PDF と同じ GHCR 画像（3.9 + pinned crossref）。cat 結合は使わない。
      image: ghcr.io/lpi-japan/admin-text:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - uses: actions/checkout@v5
      - name: Build EPUB
        run: |
          chmod +x ./build-epub.sh ./scripts/with-build-image.sh
          ./build-epub.sh
      - name: Upload EPUB artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ inputs.working-directory }}/tmp/admintext_*.epub
          archive: false
          if-no-files-found: error
