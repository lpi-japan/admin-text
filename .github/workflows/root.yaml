name: root build

on:
  push:
    branches:
      - main
      - feature/*
      - cursor/*
    paths:
      - Chapter*.md
      - image/**
      - listing.tex
      - template.tex
      - config-pdf.yaml
      - config-epub.yaml
      - crossref.yaml
      - epub.css
      - build-pdf.sh
      - build-epub.sh
      - scripts/**
      - .github/workflows/pandoc.yaml
      - .github/workflows/root.yaml

jobs:
  build:
    uses: ./.github/workflows/pandoc.yaml
    with:
      working-directory: .
